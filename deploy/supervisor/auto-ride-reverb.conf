# Realtime for auto-ride: the Reverb WebSocket server + a dedicated worker
# for the `broadcasts` queue (RealtimeUpdate / RideLocationUpdated events).
#
# Install:
#   sudo cp deploy/supervisor/auto-ride-reverb.conf /etc/supervisor/conf.d/
#   # edit the paths below for this server
#   sudo supervisorctl reread && sudo supervisorctl update
#
# After every deploy:
#   php artisan reverb:restart
#   php artisan queue:restart
#
# Reverb holds one open connection per online app, so raise the file
# descriptor limit (minfds below + `ulimit -n` / LimitNOFILE) well above the
# expected concurrent users. Put it behind nginx on :443 so the app connects
# with wss://<domain>/app/<REVERB_APP_KEY>:
#
#   location /app/ {
#       proxy_http_version 1.1;
#       proxy_set_header Host $http_host;
#       proxy_set_header Upgrade $http_upgrade;
#       proxy_set_header Connection "Upgrade";
#       proxy_read_timeout 120s;
#       proxy_pass http://127.0.0.1:8080;
#   }
#
# More than one app server? Set REVERB_SCALING_ENABLED=true (fans out via Redis)
# and run this on each.

[supervisord]
minfds=20000

[program:auto-ride-reverb]
command=php /var/www/auto-ride/artisan reverb:start --no-interaction
directory=/var/www/auto-ride
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/auto-ride/storage/logs/reverb.log
stopwaitsecs=30

[program:auto-ride-broadcasts]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/auto-ride/artisan queue:work redis --queue=broadcasts --sleep=1 --tries=3 --max-time=3600 --timeout=30
directory=/var/www/auto-ride
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/auto-ride/storage/logs/broadcasts.log
stopwaitsecs=40
