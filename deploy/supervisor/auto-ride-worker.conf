# Laravel queue worker for auto-ride.
#
# Handles: ride sequential-dispatch offers/advances (AdvanceRideDispatch,
# CancelUnclaimedRide) and promo event pushes (SendPromoEventPush). Without
# this running, no dispatch timeout, self-serve expiry, or auto-cancel will
# ever fire — jobs just sit in the `jobs` table forever.
#
# Install:
#   sudo cp deploy/supervisor/auto-ride-worker.conf /etc/supervisor/conf.d/
#   # edit the two paths below (directory / stdout_logfile) for this server
#   sudo supervisorctl reread
#   sudo supervisorctl update
#   sudo supervisorctl start auto-ride-worker:*
#
# After every deploy:
#   php artisan queue:restart   # graceful — waits for in-flight jobs to finish
#
# --timeout (650) must stay above SendPromoEventPush's own $timeout (600s),
# which itself must stay below DB_QUEUE_RETRY_AFTER in .env (recommended 700).

[program:auto-ride-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/auto-ride/artisan queue:work database --sleep=1 --tries=3 --max-time=3600 --timeout=650
directory=/var/www/auto-ride
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/auto-ride/storage/logs/worker.log
stopwaitsecs=700
