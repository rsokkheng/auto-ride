# Kafka consumer for ride-created events (auto-ride).
#
# Handles: consumes the `ride-created` topic (consumer group `ride-service`,
# see config/kafka.php) and queues ProcessRideCreated for each new ride.
# Without this running, RideCreatedProducer still publishes fine but nothing
# ever picks the events up — dispatch never starts.
#
# The `ride-created` topic has 3 partitions (see docker-compose.yml,
# KAFKA_NUM_PARTITIONS: 3). numprocs=3 below runs one consumer process per
# partition, all in the same consumer group, so Kafka balances partitions
# across them automatically — do not change numprocs without also changing
# the topic's partition count (more processes than partitions just sit idle).
#
# Install:
#   sudo cp deploy/supervisor/auto-ride-kafka-consumer.conf /etc/supervisor/conf.d/
#   # edit the two paths below (directory / stdout_logfile) for this server
#   sudo supervisorctl reread
#   sudo supervisorctl update
#   sudo supervisorctl start auto-ride-kafka-consumer:*
#
# After every deploy:
#   sudo supervisorctl restart auto-ride-kafka-consumer:*
#   # (no graceful "finish in-flight work" equivalent to queue:restart here —
#   # KAFKA_AUTO_COMMIT=true commits on an interval, so a restart mid-batch
#   # can redeliver a few messages; ProcessRideCreated's dedupe key in Redis
#   # (ride-created:event:{event_id}) makes that safe to replay.)

[program:auto-ride-kafka-consumer]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/auto-ride/artisan kafka:consume-rides
directory=/var/www/auto-ride
autostart=true
autorestart=true
startretries=100
stopasgroup=true
killasgroup=true
user=www-data
numprocs=3
redirect_stderr=true
stdout_logfile=/var/www/auto-ride/storage/logs/kafka-consumer.log
stopwaitsecs=30
